# Apache vhost for the Wasel Egypt trial image.
# __PORT__ is replaced with the $PORT env var by the entrypoint at boot
# (Render injects PORT; default 80 for local `docker run`).
<VirtualHost *:__PORT__>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
